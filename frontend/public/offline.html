<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDDRC - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon-wrap {
      width: 96px; height: 96px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: rgba(59,130,246,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap svg { width: 48px; height: 48px; color: #60a5fa; }
    h1 { font-size: 26px; margin-bottom: 12px; font-weight: 700; color: #f1f5f9; }
    p { font-size: 15px; opacity: 0.8; margin-bottom: 28px; line-height: 1.6; }
    .retry-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 12px 36px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .retry-btn:hover { background: #2563eb; transform: translateY(-1px); }
    .retry-btn:active { transform: translateY(0); }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some cached pages may still be available. Check your connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <p class="hint">Cached data will load automatically when available</p>
  </div>
</body>
</html>
